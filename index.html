<style>
  :root {
    --bg: #2b1d3a; --bg2: #3d2a52; --ink: #fdf6ec; --muted: #c9b8dd;
    --gold: #f2c14e; --gold-dk: #c99a2e; --rose: #ff8fa3; --ok: #8fe3b0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(circle at 50% 30%, var(--bg2), var(--bg) 70%);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    min-height: 100%; text-align: center;
  }
  h1 { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-weight: 400;
       font-size: 2.4rem; margin: 8px 0 4px; letter-spacing: .5px; }
  .sub { color: var(--muted); margin: 0 0 12px; font-size: 1rem; }
  .bell {
    width: min(42vw, 160px); background: none; border: none; padding: 0; cursor: pointer;
    margin: 0 0 18px; transform-origin: 50% 5%; filter: drop-shadow(0 10px 14px rgba(0,0,0,.45));
  }
  .bell svg { width: 100%; display: block; }
  .bell:active { transform: scale(.96); }
  .bell.ring { animation: ring 1.1s ease-in-out; }
  @keyframes ring {
    0%,100% { rotate: 0deg } 12% { rotate: 22deg } 30% { rotate: -20deg }
    48% { rotate: 16deg } 66% { rotate: -11deg } 84% { rotate: 5deg }
  }
  .label { color: var(--muted); font-size: .9rem; margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 460px; }
  .chip {
    background: rgba(255,255,255,.08); color: var(--ink); border: 1px solid rgba(255,255,255,.18);
    border-radius: 999px; padding: 10px 14px; font-size: .95rem; cursor: pointer;
  }
  .chip.on { background: var(--gold); color: #2b1d3a; border-color: var(--gold); font-weight: 600; }
  input[type=text] {
    margin-top: 12px; width: 100%; max-width: 460px; padding: 12px 14px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,.2); background: rgba(0,0,0,.2); color: var(--ink); font-size: 1rem;
  }
  input::placeholder { color: #a493b8; }
  .status {
    margin-top: 22px; min-height: 3.2em; max-width: 460px; font-size: 1.1rem; line-height: 1.4;
  }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--rose); }
  .reply {
    margin-top: 10px; padding: 16px 18px; border-radius: 16px; background: rgba(143,227,176,.12);
    border: 1px solid rgba(143,227,176,.4); max-width: 460px; display: none; font-size: 1.15rem;
  }
  .reply b { display: block; font-size: .8rem; color: var(--muted); font-weight: 400; margin-bottom: 4px; }
  .foot { margin-top: auto; padding-top: 28px; color: #8f7fa5; font-size: .8rem; }
  .butler { width: min(56vw, 220px); margin: 0 0 10px; transform-origin: 50% 100%;
            animation: idle 3.2s ease-in-out infinite; }
  .butler.bow { animation: bow 1.1s ease-in-out; }
  @keyframes idle { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-4px) } }
  @keyframes bow { 0%,100% { transform: rotate(0) } 35%,60% { transform: rotate(-14deg) translateY(6px) } }
  /* setup screen */
  .setup { max-width: 520px; text-align: left; line-height: 1.5; }
  .setup code { background: rgba(0,0,0,.3); padding: 2px 6px; border-radius: 6px; word-break: break-all; }
  .btn { background: var(--gold); color: #2b1d3a; border: none; border-radius: 12px; padding: 12px 18px;
         font-size: 1rem; font-weight: 600; cursor: pointer; }
  [hidden] { display: none !important; }
</style>

  <!-- mouth -->
  <path d="M462 572 Q528 560 594 574 Q566 610 528 610 Q490 608 462 572Z" fill="#8a2f2f" stroke="#14101a" stroke-width="6"/>
  <path d="M470 575 Q528 565 588 577 Q578 592 528 594 Q482 592 470 575Z" fill="#ffffff"/><path d="M490 620 Q528 632 566 620" stroke="#b37658" stroke-width="5" fill="none"/>
  <!-- chin cleft hint -->

</svg>

  <button class="bell" id="bell" aria-label="Ring for Kyle">
    <svg viewBox="0 0 200 240" aria-hidden="true">
      <g stroke="#14101a" stroke-width="5" stroke-linejoin="round">
        <!-- wooden handle -->
        <path d="M86 92 L82 60 Q78 40 90 30 Q84 18 100 10 Q116 18 110 30 Q122 40 118 60 L114 92Z" fill="#8a5a33"/>
        <path d="M80 98 Q100 88 120 98 L118 112 Q100 104 82 112Z" fill="#6b4226"/>
        <!-- brass bell -->
        <path d="M84 110 Q100 104 116 110 Q150 122 156 180 Q160 200 182 212 L18 212 Q40 200 44 180 Q50 122 84 110Z" fill="#e8b23a"/>
        <ellipse cx="100" cy="214" rx="84" ry="12" fill="#b8841f"/>

        <circle cx="100" cy="228" r="10" fill="#6d6a75"/>

      <path d="M70 130 Q58 160 58 196" stroke="#fff3c4" stroke-width="9" stroke-linecap="round" fill="none" opacity=".75"/>

    </svg>

  <div class="label">Optional: what does Madam require?</div>

  <input type="text" id="custom" maxlength="140" placeholder="Or type a special decree…">

  <div class="status" id="status"></div>

  <div class="foot">Built with love, crackers, and questionable butler energy.</div>

<section id="setup" class="setup" hidden>
  <h1 style="text-align:center">You Rang? setup</h1>
  <p>This page needs two secret channel names in its link. Tap the button to make a fresh pair.</p>
  <p><button class="btn" id="gen">Make my links</button></p>
  <div id="genOut"></div>
</section>

<script>
// ---- Settings ----------------------------------------------------------
// Channel names live in the link after "#", e.g. index.html#k=KYLE_TOPIC&c=CJ_TOPIC
//   k = the channel Kyle's phone listens to (summons go here)
//   c = the channel CJ's phone listens to (Kyle's replies go here)
const NTFY = "https://ntfy.sh";
const params = new URLSearchParams(location.hash.slice(1));
const KYLE = params.get("k");
const CJ = params.get("c");
const HER = params.get("her") || "CJ";
const HIM = params.get("him") || "Kyle";

const REQUESTS = [
  ["🥤", "Ginger ale"], ["🍪", "Crackers, stat"], ["🪣", "Bucket. NOW."],
  ["💆", "Back rub"], ["🧦", "Cold feet emergency"], ["🕷️", "Spider situation"],
  ["🫂", "Just come here"], ["🍦", "A very specific craving"]
];

// Kyle's reply buttons inside his notification (ntfy allows up to 3)
const REPLIES = [
  ["On my way!", `${HIM} is sprinting to your side. Possibly in socks.`],
  ["2 minutes", `${HIM} acknowledges the summons and will arrive in about 2 minutes.`],
  ["Fetching it", `${HIM} is fetching the thing first, then coming straight to you.`]
];

const BELL_LINES = [
  "The bell has been rung. Somewhere, a man drops everything.",
  "Summons delivered. The staff has been alerted.",
  "Ding! Your loyal servant has been notified.",
  "Message sent. Expect footsteps shortly."
];

const $ = (id) => document.getElementById(id);

if (!KYLE || !CJ) {
  $("setup").hidden = false;
  $("gen").onclick = () => {
    const rnd = () => Array.from(crypto.getRandomValues(new Uint8Array(8)), b => b.toString(16).padStart(2, "0")).join("");
    const k = "yourang-k-" + rnd(), c = "yourang-c-" + rnd();
    const link = location.href.split("#")[0] + `#k=${k}&c=${c}`;
    $("genOut").innerHTML =
      `<p><b>CJ's link</b> (open on her iPhone, then Add to Home Screen):<br><code>${link}</code></p>
       <p><b>Kyle subscribes to:</b> <code>${k}</code></p>
       <p><b>CJ subscribes to:</b> <code>${c}</code></p>
       <p>Keep these private: anyone who knows a channel name can send to it.</p>`;
  };
} else {
  $("app").hidden = false;
  startApp();
}

function startApp() {
  let picked = null;
  const chips = $("chips");
  for (const [emoji, text] of REQUESTS) {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = `${emoji} ${text}`;
    b.onclick = () => {
      const on = !b.classList.contains("on");
      chips.querySelectorAll(".chip").forEach(c => c.classList.remove("on"));
      if (on) { b.classList.add("on"); picked = text; } else picked = null;
    };
    chips.appendChild(b);
  }

  let sending = false;
  $("bell").onclick = async () => {
    if (sending) return;
    sending = true;
    const bell = $("bell");
    bell.classList.remove("ring"); void bell.offsetWidth; bell.classList.add("ring");
    if (navigator.vibrate) navigator.vibrate(80);
    playBell();
    const butler = $("butler");
    butler.classList.remove("bow"); void butler.getBoundingClientRect(); butler.classList.add("bow");

    const custom = $("custom").value.trim();
    const need = custom || picked;
    const message = need ? `${HER} requests: ${need}` : `${HER} requires your presence. No questions asked.`;

    const payload = {
      topic: KYLE,
      title: "🛎️ You rang? No: SHE rang.",
      message,
      priority: 5,
      tags: ["bell", "pregnant_woman"],
      actions: REPLIES.map(([label, body]) => ({
        action: "http", label, url: `${NTFY}/${CJ}`, method: "POST",
        headers: { Title: "Help is coming", Tags: "running_man" },
        body, clear: true
      }))
    };

    setStatus("Ringing…", "");
    try {
      // Plain-text body avoids a CORS preflight; ntfy reads it as JSON at the root URL.
      const r = await fetch(NTFY + "/", { method: "POST", body: JSON.stringify(payload) });
      if (!r.ok) throw new Error("HTTP " + r.status);
      setStatus(BELL_LINES[Math.floor(Math.random() * BELL_LINES.length)], "ok");
      $("custom").value = "";
    } catch (e) {
      setStatus("The bell rope snapped (no connection?). Try again, or just yell.", "err");
    } finally {
      setTimeout(() => { sending = false; }, 1500);
    }
  };

  // Show Kyle's replies live while the page is open.
  try {
    const since = Math.floor(Date.now() / 1000) - 15 * 60; // replies from the last 15 min
    const es = new EventSource(`${NTFY}/${CJ}/sse?since=${since}`);
    es.onmessage = (ev) => {
      const m = JSON.parse(ev.data);
      if (m.event !== "message") return;
      $("replyText").textContent = m.message;
      $("replyWhen").textContent = "Word from the staff · " +
        new Date(m.time * 1000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      $("reply").style.display = "block";
    };
  } catch (_) { /* notifications still arrive via the ntfy app */ }
}

// A classic hand bell swung a few times, synthesized so no sound file is needed.
let audioCtx;
function strike(t, base, vol) {
  [[1, 0.5, 1.6], [2.0, 0.12, 0.9], [3.0, 0.22, 1.1], [4.2, 0.07, 0.5], [5.9, 0.04, 0.3]].forEach(([mult, v, dur]) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "sine"; o.frequency.value = base * mult;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v * vol, t + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + dur + 0.05);
  });
}
function playBell() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const t = audioCtx.currentTime;
    // ding-a-ling: alternating swings, slightly detuned, fading
    [0, 0.19, 0.38, 0.57, 0.80].forEach((dt, i) =>
      strike(t + dt, 1320 * (1 + (i % 2 ? 0.004 : -0.003)), [1, 0.85, 0.8, 0.6, 0.4][i]));
  } catch (_) { /* sound is a bonus */ }
}

function setStatus(text, cls) {
  const s = $("status"); s.textContent = text; s.className = "status " + cls;
}
</script>
</body>
</html>
